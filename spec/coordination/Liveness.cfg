SPECIFICATION FairSpec

CONSTANTS
  Actors = {a, b}
  MaxTime = 1
  LeaseTicks = 1
  MaxRetries = 0
  MaxEpoch = 1
  MaxVersion = 1
  FailureBudget = 0
